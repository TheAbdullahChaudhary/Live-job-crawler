<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <title>SRE & DevOps Jobs</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3250;
      --accent:#6366f1;--accent2:#818cf8;--green:#22c55e;--yellow:#eab308;
      --blue:#3b82f6;--red:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--r:10px;
    }
    *{box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
    .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}

    /* ── sidebar ── */
    .sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
    .logo{display:flex;align-items:center;gap:10px}
    .logo h1{font-size:15px;font-weight:700}
    .logo small{font-size:11px;color:var(--muted);display:block}
    .sec{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}

    /* stats as filter buttons */
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .stat{background:var(--surface2);border:2px solid var(--border);border-radius:var(--r);padding:10px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
    .stat:hover{border-color:var(--accent)}
    .stat.active{border-color:var(--accent);background:#6366f120}
    .stat .n{font-size:20px;font-weight:700;color:var(--accent2)}
    .stat .l{font-size:11px;color:var(--muted);margin-top:2px}
    .stat.s-remote.active .n{color:var(--green)}
    .stat.s-onsite.active .n{color:var(--blue)}
    .stat.s-hybrid.active .n{color:var(--yellow)}

    .fg{display:flex;flex-direction:column;gap:7px}
    .lbl{font-size:12px;color:var(--muted)}
    select,input[type=number],input[type=text]{width:100%;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
    select:focus,input:focus{border-color:var(--accent)}
    .btn{width:100%;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}

    /* sources */
    .src-list{display:flex;flex-direction:column;gap:5px}
    .src-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s}
    .src-item:hover{border-color:var(--accent)}
    .src-item input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0}
    .src-item .sn{font-size:13px;flex:1}
    .src-item .sb{font-size:10px;padding:2px 6px;border-radius:20px;background:var(--surface);color:var(--muted)}

    .crawl-opts{display:flex;flex-direction:column;gap:7px;margin-top:4px}
    .crawl-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
    .crawl-row input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
    .crawl-row input[type=number]{width:70px;padding:5px 8px;font-size:12px}
    .btn-crawl{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}

    /* ── main ── */
    .main{display:flex;flex-direction:column;min-height:100vh}

    /* tabs */
    .tabs-bar{display:flex;align-items:center;border-bottom:1px solid var(--border);background:var(--surface);padding:0 20px;overflow-x:auto;flex-shrink:0}
    .tab{display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;flex-shrink:0}
    .tab:hover{color:var(--text)}
    .tab.active{color:var(--accent2);border-bottom-color:var(--accent)}
    .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
    .tab .dot.stopped{background:var(--muted);animation:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .tab .cls{opacity:.35;font-size:15px;line-height:1;margin-left:2px}
    .tab .cls:hover{opacity:1;color:var(--red)}

    /* panels */
    .panel{display:none;flex:1;flex-direction:column;overflow:hidden}
    .panel.active{display:flex}

    /* log */
    .log-box{background:#0d1117;border-bottom:1px solid var(--border);font-family:monospace;font-size:12px;overflow-y:auto;flex-shrink:0;transition:max-height .2s}
    .log-box.collapsed{max-height:0;border:none}
    .log-box.expanded{max-height:200px;padding:10px 18px}
    .log-toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 18px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);cursor:pointer;flex-shrink:0}
    .log-toggle:hover{color:var(--text)}
    .ll{color:#7ee787;line-height:1.7}
    .ll.info{color:var(--accent2)}
    .ll.err{color:var(--red)}
    .ll.wait{color:var(--yellow)}

    /* jobs area */
    .jobs-area{padding:18px 22px;flex:1;overflow-y:auto}
    .jobs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
    .jobs-header h2{font-size:15px;font-weight:700}
    .header-right{display:flex;align-items:center;gap:10px}
    .cnt{font-size:13px;color:var(--muted)}
    .sort-sel{padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;outline:none;cursor:pointer}
    .stop-btn{padding:5px 12px;background:#ef444420;border:1px solid var(--red);color:var(--red);border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
    .stop-btn:hover{background:#ef444440}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:9px;transition:border-color .15s,transform .15s;cursor:default}
    .card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .ct .title{font-size:14px;font-weight:600;line-height:1.4}
    .ct .co{font-size:12px;color:var(--accent2);margin-top:3px}
    .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
    .badge.remote{background:#14532d44;color:var(--green);border:1px solid #14532d}
    .badge.onsite{background:#1e3a5f44;color:var(--blue);border:1px solid #1e3a5f}
    .badge.hybrid{background:#42300044;color:var(--yellow);border:1px solid #423000}
    .badge.unknown{background:#1e1e2e;color:var(--muted);border:1px solid var(--border)}
    .meta{display:flex;flex-wrap:wrap;gap:8px}
    .mi{font-size:12px;color:var(--muted)}
    .exp-bar{background:var(--surface2);border-radius:4px;height:3px}
    .exp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
    .card-foot{display:flex;align-items:center;justify-content:space-between}
    .src-tag{font-size:10px;color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:4px}
    .apply{padding:6px 14px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;transition:background .15s}
    .apply:hover{background:var(--accent2)}
    .empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
    .empty .ei{font-size:44px;margin-bottom:10px}

    .campaign{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s}
    .campaign:hover{border-color:var(--accent)}
    .campaign.active-camp{border-color:var(--accent);background:#6366f115}
    .campaign .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .campaign .cdot.running{background:var(--green);animation:pulse 1.4s infinite}
    .campaign .cdot.done{background:var(--muted)}
    .campaign .cdot.stopped{background:var(--red)}
    .campaign .cinfo{flex:1;min-width:0}
    .campaign .cname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .campaign .cmeta{font-size:11px;color:var(--muted);margin-top:1px}
    .campaign .cclose{opacity:.3;font-size:14px;flex-shrink:0}
    .campaign .cclose:hover{opacity:1;color:var(--red)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
    .loc-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text);cursor:pointer;padding:2px 0}
    .loc-item input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0}
    .loc-item:hover{color:var(--accent2)}
    .manage-bar{display:flex;align-items:center;gap:10px;padding:8px 22px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
    .manage-bar.hidden{display:none}
    .sel-count{font-size:13px;color:var(--muted);flex:1}
    .btn-del{padding:6px 14px;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer}
    .btn-del-sel{background:#ef444420;border:1px solid var(--red);color:var(--red)}
    .btn-del-sel:hover{background:#ef444440}
    .btn-del-all{background:transparent;border:1px solid #555;color:var(--muted)}
    .btn-del-all:hover{border-color:var(--red);color:var(--red)}
    .card-check{position:absolute;top:10px;left:10px;width:16px;height:16px;accent-color:var(--accent);cursor:pointer;display:none}
    .card{position:relative}
    .select-mode .card-check{display:block}
    .select-mode .card{padding-left:34px}
    .card.selected{border-color:var(--accent);background:#6366f115}
    @media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}}
  </style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo">
      <span style="font-size:22px">⚙️</span>
      <div><h1>SRE & DevOps Jobs</h1><small>Live job crawler</small></div>
    </div>

    <!-- Stats as filter buttons -->
    <div>
      <div class="sec">Overview (click to filter)</div>
      <div class="stats-grid">
        <div class="stat" id="st-total" onclick="toggleStatFilter('total')">
          <div class="n" id="sn-total">—</div><div class="l">Total Jobs</div>
        </div>
        <div class="stat s-remote" id="st-remote" onclick="toggleStatFilter('remote')">
          <div class="n" id="sn-remote">—</div><div class="l">Remote</div>
        </div>
        <div class="stat s-onsite" id="st-onsite" onclick="toggleStatFilter('onsite')">
          <div class="n" id="sn-onsite">—</div><div class="l">Onsite</div>
        </div>
        <div class="stat s-hybrid" id="st-hybrid" onclick="toggleStatFilter('hybrid')">
          <div class="n" id="sn-hybrid">—</div><div class="l">Hybrid</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div>
      <div class="sec">Search Filters</div>
      <div class="fg">
        <span class="lbl">Role</span>
        <select id="f-role">
          <option value="">All Roles</option>
          <option value="site reliability">Site Reliability Engineer</option>
          <option value="devops">DevOps Engineer</option>
          <option value="platform engineer">Platform Engineer</option>
          <option value="infrastructure">Infrastructure Engineer</option>
        </select>
        <span class="lbl">Job Type</span>
        <select id="f-type">
          <option value="">Any Type</option>
          <option value="remote">🌍 Remote</option>
          <option value="onsite">🏢 Onsite</option>
          <option value="hybrid">🔀 Hybrid</option>
        </select>
        <span class="lbl">Location (select multiple)</span>
        <div id="loc-list" style="display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px">
          <label class="loc-item"><input type="checkbox" value="remote"/> 🌍 Remote / Worldwide</label>
          <label class="loc-item"><input type="checkbox" value="united states"/> 🇺🇸 United States</label>
          <label class="loc-item"><input type="checkbox" value="united kingdom"/> 🇬🇧 United Kingdom</label>
          <label class="loc-item"><input type="checkbox" value="canada"/> 🇨🇦 Canada</label>
          <label class="loc-item"><input type="checkbox" value="germany"/> 🇩🇪 Germany</label>
          <label class="loc-item"><input type="checkbox" value="france"/> 🇫🇷 France</label>
          <label class="loc-item"><input type="checkbox" value="netherlands"/> 🇳🇱 Netherlands</label>
          <label class="loc-item"><input type="checkbox" value="australia"/> 🇦🇺 Australia</label>
          <label class="loc-item"><input type="checkbox" value="india"/> 🇮🇳 India</label>
          <label class="loc-item"><input type="checkbox" value="pakistan"/> 🇵🇰 Pakistan</label>
          <label class="loc-item"><input type="checkbox" value="singapore"/> 🇸🇬 Singapore</label>
          <label class="loc-item"><input type="checkbox" value="poland"/> 🇵🇱 Poland</label>
          <label class="loc-item"><input type="checkbox" value="spain"/> 🇪🇸 Spain</label>
          <label class="loc-item"><input type="checkbox" value="portugal"/> 🇵🇹 Portugal</label>
          <label class="loc-item"><input type="checkbox" value="brazil"/> 🇧🇷 Brazil</label>
          <label class="loc-item"><input type="checkbox" value="europe"/> 🌍 Europe</label>
          <label class="loc-item"><input type="checkbox" value="latin america"/> 🌎 Latin America</label>
          <label class="loc-item"><input type="checkbox" value="asia"/> 🌏 Asia</label>
        </div>
        <span class="lbl">My Experience (years) — shows jobs I qualify for</span>
        <input type="number" id="f-exp" placeholder="e.g. 3" min="0" max="30"/>
        <button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>
        <button class="btn btn-ghost" style="color:#e55;border-color:#e55" onclick="clearAllJobs()">🗑 Clear All Jobs</button>
      </div>
    </div>

    <!-- Campaigns list -->
    <div>
      <div class="sec">Campaigns</div>
      <div id="campaigns-list" style="display:flex;flex-direction:column;gap:5px">
        <div style="font-size:12px;color:var(--muted);padding:4px 2px">No campaigns yet. Start a crawl.</div>
      </div>
    </div>

    <!-- Crawl -->
    <div>
      <div class="sec">Crawl Sources</div>
      <div class="src-list">
        <label class="src-item"><input type="checkbox" value="remotive" checked/><span class="sn">Remotive</span><span class="sb">API</span></label>
        <label class="src-item"><input type="checkbox" value="arbeitnow" checked/><span class="sn">Arbeitnow</span><span class="sb">API</span></label>
        <label class="src-item"><input type="checkbox" value="wwr" checked/><span class="sn">We Work Remotely</span><span class="sb">RSS</span></label>
        <label class="src-item"><input type="checkbox" value="jobicy" checked/><span class="sn">Jobicy</span><span class="sb">API</span></label>
        <label class="src-item"><input type="checkbox" value="himalayas" checked/><span class="sn">Himalayas</span><span class="sb">API</span></label>
        <label class="src-item"><input type="checkbox" value="wellfound" checked/><span class="sn">Wellfound</span><span class="sb">Scrape</span></label>
        <label class="src-item"><input type="checkbox" value="greenhouse" checked/><span class="sn">Greenhouse</span><span class="sb">55 cos</span></label>
        <label class="src-item"><input type="checkbox" value="lever" checked/><span class="sn">Lever</span><span class="sb">25 cos</span></label>
        <label class="src-item"><input type="checkbox" value="google" checked/><span class="sn">Google Search</span><span class="sb">SerpApi</span></label>
      </div>
      <div class="crawl-opts">
        <label class="crawl-row">
          <input type="checkbox" id="opt-continuous"/>
          <span>Keep crawling until stopped</span>
        </label>
        <label class="crawl-row" id="opt-duration-row" style="display:none">
          <span>Auto-stop after</span>
          <input type="number" id="opt-duration" value="60" min="1" style="width:60px"/>
          <select id="opt-unit" style="width:80px;padding:5px 6px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            <option value="60">min</option>
            <option value="3600">hr</option>
          </select>
        </label>
        <button class="btn btn-crawl" onclick="startCrawl()">↻ Start Crawl</button>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div class="tabs-bar" id="tabs-bar"></div>
    <div id="panels" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
  </main>
</div>

<script>
  let tabCounter = 0;
  const tabs = {};
  let activeStatFilter = null;
  const campaigns = {};

  async function loadCampaigns() {
    const [list, activeRes] = await Promise.all([
      fetch('/api/campaigns').then(r => r.json()),
      fetch('/api/crawl/active').then(r => r.json())
    ]);
    const activeCrawlIds = new Set(activeRes.active || []);
    list.forEach(c => {
      const isActive = activeCrawlIds.has(c.id);
      campaigns[c.id] = {label: c.label, status: isActive ? 'running' : c.status, startTime: c.start_time, jobCount: c.job_count, tabId: null};
      if (isActive) reconnectCrawl(c.id, c.label);
    });
    renderCampaigns();
  }

  function reconnectCrawl(crawlId, label) {
    const id = makeId();
    Object.keys(tabs).forEach(k => tabs[k].active = false);
    tabs[id] = {type:'crawl', label, active:true, running:true, crawl_id: crawlId};
    campaigns[crawlId].tabId = id;
    renderTabs();
    const panel = createPanel(id);
    panel.innerHTML = buildCrawlPanelHTML(id, label);
    panel.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => { if (p.id !== panel.id) p.classList.remove('active'); });
    attachCrawlStream(id, crawlId);
  }

  function saveCampaigns() {} // no-op, DB is source of truth

  function makeId(){ return 't'+(++tabCounter); }

  function renderCampaigns() {
    const el = document.getElementById('campaigns-list');
    const entries = Object.entries(campaigns);
    if (!entries.length) {
      el.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px 2px">No campaigns yet. Start a crawl.</div>';
      return;
    }
    el.innerHTML = entries.map(([id, c]) => `
      <div class="campaign ${tabs[c.tabId]?.active ? 'active-camp' : ''}" onclick="openCampaignTab('${id}')">
        <span class="cdot ${c.status}"></span>
        <div class="cinfo">
          <div class="cname">${c.label}</div>
          <div class="cmeta">${c.status==='running'?'Running…':c.status==='stopped'?'Stopped':'Done'} · ${c.jobCount} jobs · ${c.startTime}</div>
        </div>
        <span class="cclose" onclick="event.stopPropagation();removeCampaign('${id}')">×</span>
      </div>`).join('');
  }

  function openCampaignTab(campId) {
    const c = campaigns[campId];
    if (!c) return;
    // if tab still alive, just switch
    if (c.tabId && tabs[c.tabId]) { switchTab(c.tabId); return; }
    // create a jobs-view tab for this campaign
    const id = makeId();
    Object.keys(tabs).forEach(k => tabs[k].active = false);
    tabs[id] = {type:'search', label: c.label, active: true};
    c.tabId = id;
    renderTabs();
    const panel = createPanel(id);
    panel.innerHTML = `
      <div class="manage-bar hidden" id="mbar-${id}">
        <span class="sel-count" id="sel-count-${id}">0 selected</span>
        <button class="btn-del btn-del-sel" onclick="deleteSelected('${id}')">🗑 Delete Selected</button>
        <button class="btn-del btn-del-all" onclick="deleteAll('${id}')">🗑 Clear All Jobs</button>
        <button class="btn-del" style="background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="toggleSelectMode('${id}',false)">Cancel</button>
      </div>
      <div class="jobs-area">
        <div class="jobs-header">
          <h2>${c.label}</h2>
          <div class="header-right">
            <span class="cnt" id="cnt-${id}">Loading...</span>
            <select class="sort-sel" onchange="resortTab('${id}',this.value)">
              <option value="newest">🕐 Newest</option>
              <option value="oldest">🕐 Oldest</option>
              <option value="exp_asc">📈 Exp: Low→High</option>
              <option value="exp_desc">📉 Exp: High→Low</option>
              <option value="company">🏢 Company A-Z</option>
            </select>
            <button class="btn-del" style="background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px" onclick="toggleSelectMode('${id}',true)">☑ Select</button>
          </div>
        </div>
        <div class="grid" id="grid-${id}"></div>
      </div>`;
    panel.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => { if (p.id !== panel.id) p.classList.remove('active'); });
    tabs[id].filters = {};
    tabs[id].crawlId = campId;
    // sync sidebar filters into this tab
    tabs[id].filters = {
      role: document.getElementById('f-role').value,
      type: document.getElementById('f-type').value,
      locs: [...document.querySelectorAll('#loc-list input:checked')].map(o=>o.value),
      exp:  document.getElementById('f-exp').value,
    };
    loadJobsIntoTab(id, 'newest');
  }

  async function removeCampaign(id) {
    if (campaigns[id]?.tabId) closeTab(campaigns[id].tabId);
    await fetch(`/api/campaigns/${id}`, {method:'DELETE'});
    delete campaigns[id];
    renderCampaigns();
  }
  function toggleStatFilter(type) {
    if (type === 'total') {
      activeStatFilter = null;
      document.getElementById('f-type').value = '';
    } else {
      activeStatFilter = activeStatFilter === type ? null : type;
      document.getElementById('f-type').value = activeStatFilter || '';
    }
    ['total','remote','onsite','hybrid'].forEach(t => {
      document.getElementById('st-'+t).classList.toggle('active',
        t === 'total' ? activeStatFilter === null : activeStatFilter === t);
    });
    refreshActiveSearchTab();
  }

  // single persistent search tab id
  let searchTabId = null;

  function refreshActiveSearchTab() {
    const role = document.getElementById('f-role').value;
    const type = document.getElementById('f-type').value;
    const locs = [...document.querySelectorAll('#loc-list input:checked')].map(o => o.value);
    const exp  = document.getElementById('f-exp').value;
    const filters = {role, type, locs, exp};

    // update all open tabs with new filters (search + campaign)
    Object.entries(tabs).forEach(([id, t]) => {
      if (t.type !== 'search') return;
      t.filters = filters;
      if (!t.crawlId) {
        // search tab — update label
        const label = [role, type?`(${type})`:'', locs.length?locs.join('/'):'', exp?`≤${exp}yrs`:''].filter(Boolean).join(' ') || 'All Jobs';
        t.label = label;
        const h2 = document.querySelector(`#panel-${id} h2`);
        if (h2) h2.textContent = label;
      }
      loadJobsIntoTab(id);
    });

    // if no search tab exists yet, open one
    if (!searchTabId || !tabs[searchTabId]) {
      openSearchTab();
      return;
    }
    renderTabs();
    loadJobsIntoTab(searchTabId, 'newest');
  }

  // ── Tabs ──────────────────────────────────────────────────────────────────
  function renderTabs() {
    document.getElementById('tabs-bar').innerHTML = Object.entries(tabs).map(([id,t]) => `
      <div class="tab ${t.active?'active':''}" onclick="switchTab('${id}')">
        ${t.type==='crawl' ? `<span class="dot ${t.running?'':'stopped'}"></span>` : '🔍'}
        ${t.label}
        <span class="cls" onclick="event.stopPropagation();closeTab('${id}')">×</span>
      </div>`).join('');
    renderCampaigns();
  }

  function switchTab(id) {
    Object.keys(tabs).forEach(k => tabs[k].active = k===id);
    renderTabs();
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-'+id)?.classList.add('active');
  }

  function closeTab(id) {
    if (tabs[id]?.crawl_id) fetch(`/api/crawl/stop/${tabs[id].crawl_id}`,{method:'POST'});
    delete tabs[id];
    document.getElementById('panel-'+id)?.remove();
    const rem = Object.keys(tabs);
    if (rem.length) switchTab(rem[rem.length-1]); else renderTabs();
  }

  function createPanel(id) {
    const div = document.createElement('div');
    div.className = 'panel'; div.id = 'panel-'+id;
    document.getElementById('panels').appendChild(div);
    return div;
  }

  // ── Search Tab ────────────────────────────────────────────────────────────
  async function openSearchTab() {
    const role = document.getElementById('f-role').value;
    const type = document.getElementById('f-type').value;
    const locs = [...document.querySelectorAll('#loc-list input:checked')].map(o => o.value);
    const exp  = document.getElementById('f-exp').value;
    const label = [role, type?`(${type})`:'', locs.length?locs.join('/'):'', exp?`≤${exp}yrs`:''].filter(Boolean).join(' ') || 'All Jobs';

    // reuse existing search tab if it exists
    if (searchTabId && tabs[searchTabId]) {
      tabs[searchTabId].filters = {role, type, locs, exp};
      tabs[searchTabId].label = label;
      Object.keys(tabs).forEach(k => tabs[k].active = false);
      tabs[searchTabId].active = true;
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + searchTabId)?.classList.add('active');
      const h2 = document.querySelector(`#panel-${searchTabId} h2`);
      if (h2) h2.textContent = label;
      renderTabs();
      await loadJobsIntoTab(searchTabId, 'newest');
      return;
    }

    const id = makeId();
    searchTabId = id;
    Object.keys(tabs).forEach(k => tabs[k].active=false);
    tabs[id] = {type:'search', label, active:true};
    renderTabs();

    const panel = createPanel(id);
    panel.innerHTML = `
      <div class="manage-bar hidden" id="mbar-${id}">
        <span class="sel-count" id="sel-count-${id}">0 selected</span>
        <button class="btn-del btn-del-sel" onclick="deleteSelected('${id}')">🗑 Delete Selected</button>
        <button class="btn-del btn-del-all" onclick="deleteAll('${id}')">🗑 Clear All Jobs</button>
        <button class="btn-del" style="background:transparent;border:1px solid var(--border);color:var(--muted)" onclick="toggleSelectMode('${id}',false)">Cancel</button>
      </div>
      <div class="jobs-area">
        <div class="jobs-header">
          <h2>${label}</h2>
          <div class="header-right">
            <span class="cnt" id="cnt-${id}">Loading...</span>
            <select class="sort-sel" onchange="resortTab('${id}',this.value)">
              <option value="newest">🕐 Newest</option>
              <option value="oldest">🕐 Oldest</option>
              <option value="exp_asc">📈 Exp: Low→High</option>
              <option value="exp_desc">📉 Exp: High→Low</option>
              <option value="company">🏢 Company A-Z</option>
            </select>
            <button class="btn-del" style="background:transparent;border:1px solid var(--border);color:var(--muted);font-size:12px" onclick="toggleSelectMode('${id}',true)">☑ Select</button>
          </div>
        </div>
        <div class="grid" id="grid-${id}"></div>
      </div>`;
    panel.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>{ if(p.id!==panel.id) p.classList.remove('active'); });
    tabs[id].filters = {role, type, locs, exp};
    await loadJobsIntoTab(id, 'newest');
  }

  async function resortTab(id, sort) {
    await loadJobsIntoTab(id, sort);
  }

  async function loadJobsIntoTab(id, sort='newest') {
    const f = tabs[id]?.filters || {};
    const params = new URLSearchParams({sort});
    if (f.role) params.append('role', f.role);
    if (f.type) params.append('job_type', f.type);
    if (tabs[id]?.crawlId) params.append('crawl_id', tabs[id].crawlId);
    // fetch once per location then merge+dedupe
    if (f.locs && f.locs.length) {
      let all = [];
      for (const loc of f.locs) {
        const p = new URLSearchParams(params);
        p.append('location', loc);
        if (f.exp) p.append('experience', f.exp);
        const jobs = await fetch('/api/jobs?'+p).then(r=>r.json());
        all.push(...jobs);
      }
      // dedupe by id
      const seen = new Set();
      const jobs = all.filter(j => seen.has(j.id) ? false : seen.add(j.id));
      const cnt = document.getElementById('cnt-'+id);
      if (cnt) cnt.textContent = `${jobs.length} jobs found`;
      const grid = document.getElementById('grid-'+id);
      if (grid) grid.innerHTML = renderCards(jobs);
      return;
    }
    if (f.exp)  params.append('experience', f.exp);
    const jobs = await fetch('/api/jobs?'+params).then(r=>r.json());
    const cnt = document.getElementById('cnt-'+id);
    if (cnt) cnt.textContent = `${jobs.length} jobs found`;
    const grid = document.getElementById('grid-'+id);
    if (grid) grid.innerHTML = renderCards(jobs);
  }

  // ── Crawl Tab ─────────────────────────────────────────────────────────────
  // show duration row when continuous checked
  document.getElementById('opt-continuous').addEventListener('change', function() {
    document.getElementById('opt-duration-row').style.display = this.checked ? 'flex' : 'none';
  });

  function buildCrawlPanelHTML(id, label) {
    return `
      <div class="log-toggle" onclick="toggleLog('${id}')">
        <span id="log-label-${id}">▼ Live Log</span>
        <span id="log-status-${id}" style="color:var(--green)">● Running</span>
      </div>
      <div class="log-box expanded" id="log-${id}"></div>
      <div class="jobs-area">
        <div class="jobs-header">
          <h2>Crawl: ${label}</h2>
          <div class="header-right">
            <span class="cnt" id="cnt-${id}">Running...</span>
            <select class="sort-sel" onchange="resortCrawlTab('${id}',this.value)">
              <option value="newest">🕐 Newest</option>
              <option value="oldest">🕐 Oldest</option>
              <option value="exp_asc">📈 Exp: Low→High</option>
              <option value="exp_desc">📉 Exp: High→Low</option>
              <option value="company">🏢 Company A-Z</option>
            </select>
            <button class="stop-btn" id="stop-${id}" onclick="stopCrawl('${id}')">■ Stop</button>
          </div>
        </div>
        <div class="grid" id="grid-${id}"></div>
      </div>`;
  }

  function attachCrawlStream(id, crawl_id) {
    const campId = crawl_id;
    const es = new EventSource(`/api/crawl/stream/${crawl_id}`);
    es.onmessage = async e => {
      const line = JSON.parse(e.data);
      appendLog(id, line);

      async function updateCampJobCount() {
        const jobs = await fetch(`/api/jobs?crawl_id=${campId}`).then(r=>r.json());
        if (campaigns[campId]) {
          campaigns[campId].jobCount = jobs.length;
          fetch(`/api/campaigns/${campId}?job_count=${jobs.length}`, {method:'PATCH'});
          renderCampaigns();
        }
      }

      if (line.startsWith('__RUN_DONE__')) {
        await refreshCrawlJobs(id, 'newest', campId);
        loadStats();
        await updateCampJobCount();
      }
      if (line === '__DONE__') {
        es.close();
        tabs[id].running = false;
        await updateCampJobCount();
        if (campaigns[campId]) { campaigns[campId].status = 'done'; fetch(`/api/campaigns/${campId}?status=done`, {method:'PATCH'}); }
        renderTabs(); renderCampaigns();
        const st = document.getElementById('log-status-'+id);
        if (st) { st.textContent='● Stopped'; st.style.color='var(--muted)'; }
        const sb = document.getElementById('stop-'+id);
        if (sb) sb.remove();
        await refreshCrawlJobs(id, 'newest', campId);
        loadStats();
      }
    };
  }

  async function startCrawl() {
    const checked = [...document.querySelectorAll('.src-list input:checked')].map(i=>i.value);
    if (!checked.length) { alert('Select at least one source.'); return; }

    const continuous = document.getElementById('opt-continuous').checked;
    const sources    = checked.join(',');
    const label      = checked.length===6 ? 'All Sources' : checked.slice(0,2).join(',')+( checked.length>2?'…':'');

    const id = makeId();
    Object.keys(tabs).forEach(k => tabs[k].active=false);
    tabs[id] = {type:'crawl', label, active:true, running:true};
    renderTabs();

    const panel = createPanel(id);
    panel.innerHTML = buildCrawlPanelHTML(id, label);
    panel.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>{ if(p.id!==panel.id) p.classList.remove('active'); });

    const params = new URLSearchParams({sources, continuous, interval: 0});
    const {crawl_id} = await fetch('/api/crawl?'+params,{method:'POST'}).then(r=>r.json());
    tabs[id].crawl_id = crawl_id;

    if (continuous) {
      const dur = parseInt(document.getElementById('opt-duration').value) || 60;
      const unit = parseInt(document.getElementById('opt-unit').value) || 60;
      tabs[id].autoStopTimer = setTimeout(() => {
        appendLog(id, `⏱ Auto-stop triggered after ${dur} ${unit===60?'min':'hr'}`);
        stopCrawl(id);
      }, dur * unit * 1000);
    }

    const campId = crawl_id;
    const startTime = new Date().toLocaleTimeString();
    campaigns[campId] = {label: `${label} ${continuous?'(continuous)':''}`, status: 'running', tabId: id, startTime, jobCount: 0};
    await fetch(`/api/campaigns?id=${encodeURIComponent(campId)}&label=${encodeURIComponent(campaigns[campId].label)}&status=running&start_time=${encodeURIComponent(startTime)}&job_count=0`, {method:'POST'});
    renderCampaigns();

    attachCrawlStream(id, crawl_id);
  }

  async function refreshCrawlJobs(id, sort='newest', crawlId=null) {
    const url = '/api/jobs?sort='+sort + (crawlId ? '&crawl_id='+crawlId : '');
    const jobs = await fetch(url).then(r=>r.json());
    const cnt = document.getElementById('cnt-'+id);
    if (cnt) cnt.textContent = `${jobs.length} jobs`;
    const grid = document.getElementById('grid-'+id);
    if (grid) grid.innerHTML = renderCards(jobs);
  }

  async function resortCrawlTab(id, sort) {
    await refreshCrawlJobs(id, sort);
  }

  function stopCrawl(id) {
    const crawl_id = tabs[id]?.crawl_id;
    if (crawl_id) {
      fetch(`/api/crawl/stop/${crawl_id}`,{method:'POST'});
      const camp = Object.values(campaigns).find(c=>c.tabId===id);
      if (camp) { camp.status='stopped'; fetch(`/api/campaigns/${tabs[id].crawl_id}?status=stopped`,{method:'PATCH'}); saveCampaigns(); renderCampaigns(); }
    }
    if (tabs[id]?.autoStopTimer) clearTimeout(tabs[id].autoStopTimer);
  }

  function appendLog(id, line) {
    const log = document.getElementById('log-'+id);
    if (!log) return;
    const d = document.createElement('div');
    d.className = 'll' + (line==='__DONE__'?' info': line.startsWith('⏳')?' wait': line.toLowerCase().includes('error')?' err':'');
    d.textContent = line==='__DONE__' ? '✅ Crawl complete!' : line;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function toggleLog(id) {
    const box = document.getElementById('log-'+id);
    const lbl = document.getElementById('log-label-'+id);
    const collapsed = box.classList.toggle('collapsed');
    box.classList.toggle('expanded', !collapsed);
    lbl.textContent = (collapsed ? '▶' : '▼') + ' Live Log';
  }

  // ── Cards ─────────────────────────────────────────────────────────────────
  function renderCards(jobs) {
    if (!jobs.length) return `<div class="empty"><div class="ei">🔍</div><p>No jobs found. Try different filters or run a crawl.</p></div>`;
    return jobs.map(j => {
      const type = j.job_type||'unknown';
      const expText = j.experience_min!=null
        ? (j.experience_max && j.experience_min!==j.experience_max
            ? `${j.experience_min}–${j.experience_max} yrs` : `${j.experience_min}+ yrs`)
        : null;
      const expPct = j.experience_max ? Math.min(100,(j.experience_max/15)*100) : 0;
      const source = j.source || (() => { try{return new URL(j.url).hostname.replace('www.','').split('.')[0];}catch(_){return '?'} })();
      const posted = j.posted_at && j.posted_at.trim()
        ? (() => { const d = new Date(j.posted_at); return isNaN(d) ? j.posted_at : d.toLocaleDateString(); })()
        : null;
      const crawled = j.crawled_at ? j.crawled_at.slice(0,10) : null;
      return `<div class="card" data-id="${j.id}" onclick="toggleCardSelect(this)">
        <input type="checkbox" class="card-check" data-id="${j.id}" onclick="event.stopPropagation();toggleCardSelect(this.closest('.card'))"/>
        <div class="card-top">
          <div class="ct"><div class="title">${j.title}</div><div class="co">🏢 ${j.company}</div></div>
          <span class="badge ${type}">${type}</span>
        </div>
        <div class="meta">
          ${j.location?`<span class="mi">📍 ${j.location}</span>`:''}
          ${expText?`<span class="mi">🕐 ${expText}</span>`:''}
          ${posted?`<span class="mi">📅 Posted: ${posted}</span>`:''}
          ${crawled?`<span class="mi">🔄 Crawled: ${crawled}</span>`:''}
        </div>
        ${expPct?`<div class="exp-bar"><div class="exp-fill" style="width:${expPct}%"></div></div>`:''}
        <div class="card-foot">
          <span class="src-tag">📡 ${source}</span>
          <a class="apply" href="${j.url}" target="_blank" onclick="event.stopPropagation()">Apply →</a>
        </div>
      </div>`;
    }).join('');
  }

  function toggleSelectMode(tabId, on) {
    const panel = document.getElementById('panel-'+tabId);
    const mbar  = document.getElementById('mbar-'+tabId);
    if (!panel || !mbar) return;
    panel.querySelector('.jobs-area').classList.toggle('select-mode', on);
    mbar.classList.toggle('hidden', !on);
    if (!on) panel.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    updateSelCount(tabId);
  }

  function toggleCardSelect(card) {
    const panel = card.closest('.jobs-area');
    if (!panel?.classList.contains('select-mode')) return;
    card.classList.toggle('selected');
    card.querySelector('.card-check').checked = card.classList.contains('selected');
    // find tabId
    const tabId = card.closest('.panel')?.id?.replace('panel-','');
    if (tabId) updateSelCount(tabId);
  }

  function updateSelCount(tabId) {
    const panel = document.getElementById('panel-'+tabId);
    const count = panel?.querySelectorAll('.card.selected').length || 0;
    const el = document.getElementById('sel-count-'+tabId);
    if (el) el.textContent = `${count} selected`;
  }

  async function deleteSelected(tabId) {
    const panel = document.getElementById('panel-'+tabId);
    const ids = [...panel.querySelectorAll('.card.selected')].map(c => c.dataset.id).join(',');
    if (!ids) return;
    if (!confirm(`Delete ${ids.split(',').length} selected jobs?`)) return;
    await fetch(`/api/jobs/selected?ids=${ids}`, {method:'DELETE'});
    toggleSelectMode(tabId, false);
    await loadJobsIntoTab(tabId, 'newest');
    loadStats();
  }

  async function deleteAll(tabId) {
    if (!confirm('Delete ALL jobs from the database?')) return;
    await fetch('/api/jobs', {method:'DELETE'});
    toggleSelectMode(tabId, false);
    await loadJobsIntoTab(tabId, 'newest');
    loadStats();
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  async function loadStats() {
    const role = document.getElementById('f-role').value;
    const exp  = document.getElementById('f-exp').value;
    const locs = [...document.querySelectorAll('#loc-list input:checked')].map(o => o.value);
    // build base params (no job_type so we can count each type)
    const base = new URLSearchParams();
    if (role) base.append('role', role);
    if (exp)  base.append('experience', exp);

    async function countType(type) {
      if (!locs.length) {
        const p = new URLSearchParams(base);
        if (type) p.append('job_type', type);
        return (await fetch('/api/jobs?'+p).then(r=>r.json())).length;
      }
      let all = [];
      for (const loc of locs) {
        const p = new URLSearchParams(base);
        if (type) p.append('job_type', type);
        p.append('location', loc);
        all.push(...await fetch('/api/jobs?'+p).then(r=>r.json()));
      }
      const seen = new Set();
      return all.filter(j => seen.has(j.id) ? false : seen.add(j.id)).length;
    }

    const [total, remote, onsite, hybrid] = await Promise.all([
      countType(''), countType('remote'), countType('onsite'), countType('hybrid')
    ]);
    document.getElementById('sn-total').textContent  = total;
    document.getElementById('sn-remote').textContent = remote;
    document.getElementById('sn-onsite').textContent = onsite;
    document.getElementById('sn-hybrid').textContent = hybrid;
  }

  async function clearAllJobs() {
    if (!confirm('Delete ALL jobs from the database?')) return;
    await fetch('/api/jobs', {method:'DELETE'});
    loadStats();
    Object.keys(tabs).forEach(id => { if (tabs[id].type !== 'crawl') loadJobsIntoTab(id); });
  }

  function clearFilters() {
    ['f-role','f-type','f-exp'].forEach(id=>{
      const el=document.getElementById(id);
      el.tagName==='SELECT'?el.selectedIndex=0:el.value='';
    });
    [...document.querySelectorAll('#loc-list input')].forEach(o => o.checked = false);
    activeStatFilter=null;
    ['total','remote','onsite','hybrid'].forEach(t=>document.getElementById('st-'+t).classList.remove('active'));
    refreshActiveSearchTab();
    loadStats();
  }

  // init
  loadStats();
  loadCampaigns();
  openSearchTab();
  // auto-refresh on filter change
  ['f-role','f-type'].forEach(fid => {
    document.getElementById(fid).addEventListener('change', () => { refreshActiveSearchTab(); loadStats(); });
  });
  document.getElementById('f-exp').addEventListener('input', () => { refreshActiveSearchTab(); loadStats(); });
  document.querySelectorAll('#loc-list input').forEach(cb => {
    cb.addEventListener('change', () => { refreshActiveSearchTab(); loadStats(); });
  });
</script>
</body>
</html>
